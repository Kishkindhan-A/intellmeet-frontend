name: Code security analysis
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
