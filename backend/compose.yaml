# Local development only. See docs/DEPLOYMENT.md for production requirements.
name: intellmeet
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    NODE_ENV: development
    MONGODB_URI: mongodb://mongo:27017/intellmeet?replicaSet=rs0&directConnection=true
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run npm run setup}@redis:6379
    SMTP_URL: smtp://mailpit:1025
    S3_ENDPOINT: http://storage:8333
    LIVEKIT_URL: ws://livekit:7880
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    mongo-init: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    storage: { condition: service_started }
    mailpit: { condition: service_started }
services:
  api:
    <<: *app
    ports: ['127.0.0.1:4000:4000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [node, dist/worker.js]
    stop_grace_period: 3m
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "import {Redis} from 'ioredis'; const r=new Redis(process.env.REDIS_URL); const h=await r.get('intellmeet:worker:heartbeat'); await r.quit(); process.exit(h && Date.now()-Number(h)<120000 ? 0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 4
  mongo:
    image: mongo:8.2.6
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.2.6
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: [mongosh, --host, mongo:27017, --quiet, --eval]
    command:
      - "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; let ready=false; for(let i=0;i<60;i++){ if(db.hello().isWritablePrimary){ready=true;break;} sleep(1000); } if(!ready) quit(1);"
  redis:
    image: redis:8.2-bookworm
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${REDIS_PASSWORD:?Run npm run setup}',
        --maxmemory-policy,
        noeviction,
      ]
    environment: { REDISCLI_AUTH: '${REDIS_PASSWORD}' }
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.48
    command: [mini, -dir=/data, -s3.port=8333]
    environment:
      AWS_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:?Run npm run setup}'
      AWS_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:?Run npm run setup}'
      S3_BUCKET: '${S3_BUCKET:-intellmeet}'
    ports: ['127.0.0.1:9000:8333']
    volumes: [storage-data:/data]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  livekit:
    profiles: [media]
    image: livekit/livekit-server:v1.13.9
    command: [--config, /etc/livekit.yaml]
    volumes: [./.data/livekit.yaml:/etc/livekit.yaml:ro]
    ports: ['127.0.0.1:7880:7880', '127.0.0.1:7881:7881', '127.0.0.1:7882:7882/udp']
    depends_on:
      redis: { condition: service_healthy }
  egress:
    profiles: [media]
    image: livekit/egress:v1.15.0
    environment: { EGRESS_CONFIG_FILE: /etc/egress.yaml }
    volumes: [./.data/egress.yaml:/etc/egress.yaml:ro]
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    depends_on: [livekit]
volumes:
  mongo-data:
  redis-data:
  storage-data:
