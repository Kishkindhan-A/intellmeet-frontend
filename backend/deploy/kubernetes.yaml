# Application-only production baseline. Provision managed MongoDB, Redis, private S3,
# LiveKit, TLS ingress, secret manager and restricted egress before applying.
# Replace the image with an immutable digest. Create the existing intellmeet-env Secret
# out of band; never store production values in this file.
apiVersion: v1
kind: Namespace
metadata:
  name: intellmeet
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intellmeet
  namespace: intellmeet
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: intellmeet
spec:
  replicas: 2
  selector:
    matchLabels: { app: intellmeet-api }
  template:
    metadata:
      labels: { app: intellmeet-api }
    spec:
      serviceAccountName: intellmeet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: intellmeet-backend:REPLACE_WITH_IMMUTABLE_RELEASE
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: intellmeet-env }
          env:
            - { name: NODE_ENV, value: production }
            - { name: REQUIRE_ADMIN_MFA, value: "true" }
          ports:
            - { name: http, containerPort: 4000 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: intellmeet
spec:
  replicas: 1
  selector:
    matchLabels: { app: intellmeet-worker }
  template:
    metadata:
      labels: { app: intellmeet-worker }
    spec:
      serviceAccountName: intellmeet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: intellmeet-backend:REPLACE_WITH_IMMUTABLE_RELEASE
          command: [node, dist/worker.js]
          envFrom:
            - secretRef: { name: intellmeet-env }
          env:
            - { name: NODE_ENV, value: production }
            - { name: REQUIRE_ADMIN_MFA, value: "true" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: intellmeet
spec:
  selector: { app: intellmeet-api }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: intellmeet
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: intellmeet-api }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: intellmeet
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-ingress
  namespace: intellmeet
spec:
  podSelector:
    matchLabels: { app: intellmeet-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 4000 }
# Egress stays denied until the operator supplies environment-specific DNS,
# database, Redis, S3, SMTP, LiveKit and OpenAI egress/proxy allowlists.
